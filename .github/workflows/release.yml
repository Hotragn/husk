name: release

# Publishing is the last gap between "this works on my machine and in CI" and
# `npx -y @husk-ai/mcp` working for someone who has never cloned the repo -- which
# is the command the README, the docs and every MCP onboarding flow already
# tell people to run.
#
# Deliberately manual and tag-driven. Nothing publishes on a push to main: a
# package manager is the one place where an accidental release cannot be taken
# back, only superseded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check everything, publish nothing.
        type: boolean
        default: true
      # So the Release step can be exercised before a release depends on it. A
      # step whose first real run is a real release is not a step anyone has
      # tested. Point this at a throwaway tag and watch a Release appear.
      #
      # Prefer a tag that does not match `v*`, like `release-test-1`. A `v*`
      # tag is the push trigger above, so pushing one starts a workflow run
      # -- the first step refuses it for not matching core's version, so
      # nothing publishes, but a red run on a tag nobody meant to release is
      # noise worth not making. A non-`v*` tag pushes inertly and this input
      # is then the only path to the Release step.
      release_tag:
        description: Existing tag to cut a GitHub Release for. Empty skips that step. Prefer a non-v* name.
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, not read, because the last step cuts the GitHub Release. Until
      # 0.1.2 that was done by hand every time, and a tag nobody turns into a
      # Release is invisible: it shows up in no feed, no watch notification and
      # not in the sidebar, so the only people who learn a version shipped are
      # the ones already running `npm view`.
      contents: write
      # Lets npm record where the tarball was built, so a consumer can verify
      # this repo produced it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # `registry-url` is deliberately absent. Given one, setup-node writes
          # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and *also*
          # exports `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` when that variable
          # is unset -- see its src/authutil.ts, unchanged from v4 through v6.
          # So dropping the token does not leave the stanza empty, it leaves a
          # well-formed useless one, and whether npm then tries OIDC at all is
          # disputed across npm versions (actions/setup-node#1551,
          # npm/documentation#1960, against npm's own "detects OIDC before
          # falling back to tokens"). registry.npmjs.org is npm's default, so
          # omitting this costs nothing and removes the dispute.

      # First, and carrying the same condition as the publish step, because it
      # exists to guard that step.
      #
      # It used to sit after the tests, keyed on `startsWith(github.ref,
      # 'refs/tags/v')`. Two holes in that. A manual run with dry_run: false
      # dispatches from a branch, so this was skipped entirely and publish ran
      # anyway, from whatever was checked out. And a stray `v*` tag -- the push
      # trigger above fires on any of them -- only failed here by virtue of
      # step ordering nobody had written down as load-bearing.
      #
      # Needs nothing but the checkout, so it costs seconds rather than
      # failing after four minutes of install, build and test.
      - name: refuse to publish anything but a matching v* tag
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "refusing to publish from ${GITHUB_REF}: a publish requires a v* tag" >&2
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match @husk-ai/core $pkg" >&2
            exit 1
          fi

      # After the refusal above, never before it. Trusted publishing needs npm
      # >= 11.5.1 and Node >= 22.14.0. Node satisfies itself -- '22' resolves to
      # 22.23.2 -- but it bundles npm 10.9.8, and will keep doing so for as long
      # as 22 is the pinned major, so setup-node alone never clears the floor.
      # Re-check nodejs.org/dist/index.json before assuming this is still
      # needed.
      #
      # Ordering is load-bearing in one direction only: the refusal costs
      # seconds and needs nothing but the checkout, which is the whole reason it
      # sits first. Putting a global install ahead of it makes a stray tag pay
      # for the install before being told no.
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm test

      # Same checks you can run locally with `npm run preflight`, so a release
      # never fails on something that was knowable before the tag existed.
      - run: npm run preflight

      # Every package ships only `dist`. If a build was skipped, this is where
      # it shows up -- as an empty tarball rather than as a broken install.
      - name: every package packs something
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            size="$(cd "$dir" && npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0)).at(0).unpackedSize")"
            echo "$name: $size bytes"
            if [ "$size" -lt 2000 ]; then
              echo "$name packs almost nothing; did its build run?" >&2
              exit 1
            fi
          done

      # The dependency order is the build order. npm does not work it out for
      # a publish, and a package published before its dependency is a version
      # nobody can install for as long as it takes to notice.
      #
      # ONE PACKAGE, ON PURPOSE, FOR THE FIRST OIDC RELEASE. No dry run can
      # prove OIDC authenticates -- dry_run publishes nothing, so it exercises
      # every step except the one being changed -- and the only way to find out
      # is a publish that really happens. `core` is the one package safe to send
      # alone: it depends on zod and on no `@husk-ai/*`, so a half-published
      # version strands no dependant. Any other single package would ship
      # pointing at a version not yet on the registry.
      #
      # This list is deliberately NOT gated on a version number, because a
      # hardcoded version in a workflow is a fact that goes stale silently --
      # the class scripts/drift-check.mjs exists for. Instead the step below
      # verifies all eleven unconditionally, so this reduced list cannot survive
      # unnoticed: the run stays red until the follow-up restores the full list
      #   core runtime models browser sessions agent adapters mcp server sdk cli
      # and publishes the remaining ten at the same version. Red here means the
      # release is genuinely incomplete, which is the truth worth reporting.
      #
      # No NODE_AUTH_TOKEN, and no `npm whoami` guard. Under trusted publishing
      # there is no static identity to report -- the OIDC exchange happens
      # inside `npm publish` for one package at a time -- so whoami answers 401
      # by design and the old guard would fail every run before it published
      # anything. The check that replaces it is below, and it reads the
      # registry rather than an exit status.
      #
      # `--provenance` is gone too: trusted publishing attests automatically.
      - name: publish, in dependency order
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          for pkg in core; do
            echo "publishing @husk-ai/$pkg"
            npm publish --workspace="@husk-ai/$pkg" --access public
          done

      # Ask the registry, because a publish step that exits 0 has been wrong
      # before: 0.1.2's run reported success while four packages still 404'd.
      #
      # All eleven, every time, and deliberately not the list published above.
      # A release is eleven packages at one version; anything less is a release
      # someone cannot install, whichever step stopped early and whatever the
      # reason. Keeping the two lists independent is what makes the reduced
      # publish list above safe to commit -- it cannot quietly become permanent,
      # because the run cannot go green until all eleven are on the registry.
      #
      # A missing attestation fails too: it means OIDC fell back to something
      # else and the provenance we stopped asking for explicitly stopped
      # arriving.
      - name: all eleven are on the registry, with provenance
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/core/package.json').version")"
          missing=()
          unattested=()
          unknown=()
          err="$(mktemp)"

          # `--prefer-online` on every lookup, because npm answers `view` from
          # its local cache by default -- `npm view <spec> --offline` returns a
          # version with no network at all, and `prefer-online` is false. The
          # cache here is not empty: setup-node restores one, and `npm publish`
          # reads the packument moments before writing to it. Without this flag
          # the step can read a pre-publish packument and call a package that
          # was just published missing, which is the one failure this check must
          # never invent.
          #
          # Three tries, because "the registry did not answer" and "the package
          # is not there" are different facts and only one of them means the
          # release is broken. E404 is conclusive and returns immediately; any
          # other failure is retried and, if it never resolves, reported as
          # unverifiable rather than as missing. A wrong diagnosis of a real
          # failure costs more than the retry does.
          lookup() {
            local spec="$1" field="$2" out attempt
            for attempt in 1 2 3; do
              if out="$(npm view --prefer-online "$spec" "$field" --json 2>"$err")"; then
                printf '%s' "$out"
                return 0
              fi
              if grep -qE 'E404|404 Not Found' "$err"; then
                return 44
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            sed -n '1,5p' "$err" >&2
            return 99
          }

          # `rc=0; cmd || rc=$?` and not `if ! cmd`. Inside the body of an
          # `if ! cmd` the negation has already succeeded, so `$?` reads 0 and
          # every conclusive E404 would be misfiled as "could not verify" --
          # which would have reported a genuinely incomplete release as a flaky
          # network check, the one confusion this step was rewritten to remove.
          for pkg in core runtime models browser sessions agent adapters mcp server sdk cli; do
            spec="@husk-ai/$pkg@$version"

            rc=0
            lookup "$spec" version >/dev/null || rc=$?
            if [ "$rc" -ne 0 ]; then
              case "$rc" in
                44) echo "MISSING  $spec"; missing+=("$pkg") ;;
                *)  echo "UNVERIFIABLE  $spec -- registry did not answer"; unknown+=("$pkg") ;;
              esac
              continue
            fi

            # A lookup that cannot answer is not the same as a package with no
            # attestation, so it lands in `unknown` rather than accusing a good
            # publish of shipping without provenance.
            rc=0
            attestations="$(lookup "$spec" dist.attestations)" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 44 ]; then
              echo "UNVERIFIABLE  $spec -- attestation lookup did not answer"
              unknown+=("$pkg")
              continue
            fi
            if [ -z "$attestations" ] || [ "$attestations" = "undefined" ] || [ "$attestations" = "null" ]; then
              echo "NO ATTESTATION  $spec"
              unattested+=("$pkg")
              continue
            fi
            echo "ok  $spec"
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::$version is incomplete on the registry: ${missing[*]} not published. A release is all eleven packages at one version." >&2
          fi
          if [ "${#unattested[@]}" -gt 0 ]; then
            echo "::error::published without provenance: ${unattested[*]}. Trusted publishing should attest automatically; check that OIDC authenticated rather than a token." >&2
          fi
          if [ "${#unknown[@]}" -gt 0 ]; then
            echo "::error::could not verify ${unknown[*]} after three tries. This does not say the publish failed -- it says the check could not confirm it. Re-run this job, or check by hand with: npm view @husk-ai/<pkg>@$version" >&2
          fi
          if [ "${#missing[@]}" -gt 0 ] || [ "${#unattested[@]}" -gt 0 ] || [ "${#unknown[@]}" -gt 0 ]; then
            exit 1
          fi

      # Last, and only on a real tag: if npm rejected a package there is nothing
      # to announce. `--verify-tag` refuses to invent a Release for a tag that
      # does not exist, and `--generate-notes` fills the body from the commits
      # since the previous tag -- worth editing afterwards, but a Release with
      # generated notes beats a tag with none.
      - name: cut the GitHub Release
        if: ${{ github.event_name == 'push' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # On a tag push this is the tag. On a manual run it is whatever tag
          # you named, which is how this step gets exercised outside a release.
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

      - name: dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Everything built, packed and checked. Nothing was published."
