name: e2e

# The whole chat path on a real Docker computer with a real browser:
# scripts/e2e-computers.mjs. GitHub's Linux runners have Docker; the unit
# suites run everywhere else without it.

on:
  push:
    branches: [main]
    paths: ['packages/**', 'apps/console/**', 'apps/desktop/**', 'package.json', 'package-lock.json', 'scripts/e2e-computers.mjs', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['packages/**', 'apps/console/**', 'apps/desktop/**', 'package.json', 'package-lock.json', 'scripts/e2e-computers.mjs', '.github/workflows/e2e.yml']

permissions:
  contents: read

jobs:
  computers:
    name: chat tools on a docker computer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker version
      # Drives the runner's own Chrome through the console. Not a dependency of Husk.
      - run: npm i --no-save playwright-core@1.48.2
      # The desktop app, run from the checkout on a virtual screen with a
      # compositor, and ffmpeg to film that screen and the console as GIFs.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xcompmgr x11-xserver-utils ffmpeg
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run e2e:computers
        env:
          E2E_CONSOLE: '1'
          E2E_DESKTOP: '1'
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
