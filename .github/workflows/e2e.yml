name: e2e

# The whole chat path on a real Docker computer with a real browser:
# scripts/e2e-computers.mjs. GitHub's Linux runners have Docker; the unit
# suites run everywhere else without it.

on:
  push:
    branches: [main]
    paths: ['packages/**', 'apps/console/**', 'apps/desktop/**', 'package.json', 'package-lock.json', 'scripts/e2e-computers.mjs', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['packages/**', 'apps/console/**', 'apps/desktop/**', 'package.json', 'package-lock.json', 'scripts/e2e-computers.mjs', '.github/workflows/e2e.yml']

permissions:
  contents: read

jobs:
  computers:
    name: chat tools on a docker computer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker version
      # Drives the runner's own Chrome through the console. Not a dependency of Husk.
      - run: npm i --no-save playwright-core@1.48.2
      # The desktop app, run from the checkout on a virtual screen with a
      # compositor, and ffmpeg to film that screen and the console as GIFs.
      # This step stalled twice with nothing printed, even non-interactive and
      # without recommended packages. Now it says what it is doing, a stalled
      # download times out and is tried again, and the image's own package
      # lists are tried before a fresh index from every configured repository.
      - name: Install the virtual screen and ffmpeg
        timeout-minutes: 15
        run: |
          get='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          mirrors=/etc/apt/apt-mirrors.txt
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # The runner's Azure mirror stalls, on the same file each try, and a
              # trickle is never a timeout. A retry leaves it out, for the next
              # mirror in the runner's list, or Ubuntu's own when it was the only one.
              if [ -f "$mirrors" ] && grep -q 'azure\.archive\.ubuntu\.com' "$mirrors"; then
                sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
                grep -q . "$mirrors" || echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee "$mirrors" >/dev/null
                echo "attempt $attempt, from:"; cat "$mirrors"
              fi
              timeout 120 sudo apt-get update $get || true
            fi
            timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o DPkg::Lock::Timeout=60 $get xvfb xauth xcompmgr ffmpeg && exit 0
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run e2e:computers
        env:
          E2E_CONSOLE: '1'
          E2E_DESKTOP: '1'
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  # The browser journeys on computers whose browser is Lightpanda, timed beside
  # Chrome. It fails only when Lightpanda stops working in Husk at all; a
  # journey Lightpanda cannot do yet is written to the job's summary instead,
  # with the numbers that decide whether it can be the default.
  lightpanda:
    name: the browser journeys on lightpanda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:computers
        env:
          E2E_BROWSER: lightpanda
