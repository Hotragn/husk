name: desktop

# Builds the Husk desktop app (apps/desktop) on each platform, starts the
# packaged app in smoke mode, and uploads the unsigned installer. Nothing is
# signed or published here: that needs the maintainer's certificates.

on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'packages/**', 'apps/console/**', 'package-lock.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'packages/**', 'apps/console/**', 'package-lock.json', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Husk
        run: |
          npm ci
          npm run build
      - name: Install the desktop app's tools
        working-directory: apps/desktop
        run: npm ci
      - name: Test the app's decisions
        working-directory: apps/desktop
        run: npm test
      - name: Stage the bundled Husk and package the app
        working-directory: apps/desktop
        run: |
          npm run stage
          npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app and load the console
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a npm run smoke
          else
            npm run smoke
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: husk-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: error
