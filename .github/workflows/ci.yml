name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSK_LOG_LEVEL: warn

jobs:
  starter:
    uses: ./.github/workflows/starter.yml
  packages:
    name: packages (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  wsl:
    name: the free path on Windows, through WSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # GitHub's Windows runners have no WSL, so the packages job checks the
      # free path in cmd.exe. This job installs WSL 2 and checks it in Linux.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
      - run: npm ci
      - run: npm run build
      - run: npm test -w @husk-ai/cli -- smoke.test.ts
        env:
          HUSK_EXPECT_WSL: '1'

  drift:
    name: duplicated facts still agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: node scripts/drift-check.mjs

  drift-sites:
    name: the sites agree too (advisory)
    runs-on: ubuntu-latest
    # The sites are outside the npm workspace. A typo in one must not gate a
    # runtime fix, so this reports without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: node scripts/drift-check.mjs --sites

  secrets:
    name: no credentials in the tree or the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: node scripts/secret-scan.mjs
