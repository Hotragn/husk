<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 194" width="182" height="194" role="img" aria-labelledby="husk-lockup-s-title">
  <title id="husk-lockup-s-title">Husk</title>
  <style>
    .husk-shell { fill: var(--husk-mark-shell, #deb076); }
    .husk-core  { fill: var(--husk-mark-core,  #42d0cf); }
    .husk-word  { stroke: var(--husk-word, #f8f5f1); }
    @media (prefers-color-scheme: light) {
      .husk-shell { fill: var(--husk-mark-shell, #623d00); }
      .husk-core  { fill: var(--husk-mark-core,  #005251); }
      .husk-word  { stroke: var(--husk-word, #252019); }
    }
  </style>

  <!-- Mark at 3.448x: ink 100 x 100, centred on the wordmark's 185-unit width. -->
  <g transform="translate(35.83 -5.172) scale(3.448)">
    <path class="husk-shell" d="M13 1.5 L3.5 9 L1.5 19 L9 30.5 L17 28 L13.5 22 L12.5 15.5 L15.5 8.5 L20 4 Z"/>
    <path class="husk-shell" d="M23.5 3 L30 10 L30.5 20 L26 27.5 L23.5 20 L23.8 11 Z"/>
    <path class="husk-core" d="M18.2 9.5 L21 15 L18.8 26.5 L15.5 15.5 Z"/>
  </g>

  <!-- 26 units of air between the mark's ink baseline and the wordmark's
       ascender line. -->
  <g class="husk-word" transform="translate(0 126)" fill="none" stroke-width="9" stroke-linecap="butt" stroke-linejoin="bevel">
    <path d="M4.5 0 L4.5 68"/>
    <path d="M4.5 40 L13 28.5 L28 28.5 L36.5 40 L36.5 68"/>
    <path d="M58.5 24 L58.5 52 L67 63.5 L82 63.5 L90.5 52 L90.5 24"/>
    <path d="M136 28.5 L113 28.5 L129 63.5 L106 63.5"/>
    <path d="M153.5 0 L153.5 68"/>
    <path d="M179 27.9 L152.5 43 L179 64.5"/>
  </g>
</svg>
